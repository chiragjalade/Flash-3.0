<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -150 13266 2665.4" fill="none">
<!-- QuantHive lockup. Exported from Figma node 1875:86770 of the Flash 2.0 file
     (P9oblWIcJSnr7hbzGaMZG8) and composited here as ONE flat black shape.

     Flat black is deliberate: this file is never painted. It is rasterised into an
     offscreen canvas so its ALPHA can drive the liquid-metal shader
     (src/shaders/liquidMetal.ts). Colour is irrelevant, coverage is everything —
     so keep every path opaque black, and add no gradient, stroke, filter, opacity
     or clip-path, all of which would corrupt the mask.

     Composed from the two source assets: the hex mark (1891.77 x 2365.4) at the
     origin, and the "QuantHive" wordmark (10626.33 x 1601.672) at
     (2339.67, 256.4) — offsets measured off a 4096px render of the node, and
     verified against it at 0.26% edge-antialiasing difference.

     The viewBox carries 150 units of padding on every side. That is NOT visual
     margin, it is required by the mask pipeline: the shader's bevel comes from a
     distance transform seeded on background pixels, and the mark's hex touches all
     four edges of the art box. With no padding those edges have no background to
     measure against, so the transform reads them as deep interior and the bevel
     flattens out along them. The padding must stay >= the bevel width (~5% of art
     height, so ~118 units) for the bevel to resolve correctly. -->
